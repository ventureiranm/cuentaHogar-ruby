# Tokens en claro para los tests: "lucia-token", "pedro-token", "expired-token"
lucia:
  user: lucia
  token_digest: <%= OpenSSL::Digest::SHA256.hexdigest("lucia-token") %>
  expires_at: <%= 10.days.from_now.to_fs(:db) %>

pedro:
  user: pedro
  token_digest: <%= OpenSSL::Digest::SHA256.hexdigest("pedro-token") %>
  expires_at: <%= 10.days.from_now.to_fs(:db) %>

expired:
  user: diego
  token_digest: <%= OpenSSL::Digest::SHA256.hexdigest("expired-token") %>
  expires_at: <%= 1.day.ago.to_fs(:db) %>
