    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d %b %H:%M"
      long: "%d de %B de %Y %H:%M"
    am: "a. m."
    pm: "p. m."

  number:
    format:
      delimiter: "."
      separator: ","
      precision: 2
